[project]
name = "clickhouse-syphon"
version = "0.1.0"
description = "Bridge pour synchroniser tables ClickHouse vers PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-sqlalchemy>=0.3.2",
    "loguru>=0.7.3",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.12.12", "python-dotenv>=1.0.0"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
