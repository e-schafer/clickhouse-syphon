
# Use standard Python image which has better wheel support
FROM ghcr.io/astral-sh/uv:python3.13-trixie-slim AS production

# Install build and runtime dependencies
RUN apt-get update && apt-get install -y --no-install-recommends \
    libpq5 \
    libffi8 \
    zstd \
    openssl \
    gcc \
    libc6-dev \
    pkg-config \
    libzstd-dev \
    && rm -rf /var/lib/apt/lists/*

WORKDIR /app

# Copy dependency files and install directly in production
COPY pyproject.toml uv.lock* ./

# Install dependencies (using pre-compiled wheels when available)
RUN uv sync --frozen --no-dev

# Copy application code
COPY src/ ./

# Create a non-root user for security
RUN useradd --create-home --shell /bin/bash --uid 1001 app && chown -R app:app /app
USER app

# Default command
CMD ["uv","run", "--no-dev", "main.py"]